# Manté viu el projecte Supabase «antdefender» (free tier): Supabase pausa els projectes
# després de 7 dies sense cap petició, i llavors el joc perd l'analítica en silenci.
# Cada 2 dies fa una petició REST amb la clau publicable (és pública per disseny).
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST de Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_Fbej14CUtjIHL6n0tehZaw____YKdjd" \
            -H "Authorization: Bearer sb_publishable_Fbej14CUtjIHL6n0tehZaw____YKdjd" \
            "https://ltsuvyyjekxdrxptyyrg.supabase.co/rest/v1/matches?select=id&limit=1")
          echo "HTTP $code"
          # 200/401/403 = projecte viu (RLS pot denegar el SELECT a anon); 000/5xx = pausat o caigut
          case "$code" in 200|401|403|404) exit 0;; *) echo "Supabase no respon (projecte pausat?)"; exit 1;; esac
