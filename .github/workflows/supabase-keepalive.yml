# Manté viu el projecte Supabase «antdefender» (free tier): Supabase pausa els projectes
# després de 7 dies sense activitat, i llavors el joc perd l'analítica en silenci.
#
# 11-oct-2026: la versió anterior (lectura de `matches` cada 2 dies, que la RLS denega a anon)
# s'executava bé però Supabase NO ho comptava com a activitat i el projecte es va pausar igual.
# Ara, CADA DIA, crida la funció `keepalive_ping()` (security definer, executable per anon),
# que fa una ESCRIPTURA real: actualitza la data de la fila única de `public.keepalive`.
# Només dona per bona una resposta 200: si falla, GitHub envia un correu.
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Escriptura de keep-alive a Supabase
        run: |
          body=$(mktemp)
          code=$(curl -s -o "$body" -w "%{http_code}" -X POST \
            -H "apikey: sb_publishable_Fbej14CUtjIHL6n0tehZaw____YKdjd" \
            -H "Authorization: Bearer sb_publishable_Fbej14CUtjIHL6n0tehZaw____YKdjd" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://ltsuvyyjekxdrxptyyrg.supabase.co/rest/v1/rpc/keepalive_ping")
          echo "HTTP $code"; cat "$body"; echo
          if [ "$code" != "200" ]; then
            echo "::error::Supabase no ha acceptat el keep-alive (HTTP $code). Projecte pausat o funció keepalive_ping() inexistent?"
            exit 1
          fi
